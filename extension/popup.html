<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DevOps TempMail</title>
    <style>
        body { width: 260px; font-family: sans-serif; padding: 12px; margin: 0; background: #f9f9f9; }
        h3 { font-size: 14px; margin-top: 0; color: #333; }
        button { width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 8px; font-weight: bold; }
        button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #5a6268; }
        #status, #inbox { font-size: 11px; color: #555; word-break: break-all; margin-top: 5px; }
    </style>
</head>
<body>
    <h3>TempMail Manager</h3>
    <button id="generateBtn">Create Account and Fill fields</button>
    <div id="status"></div>
    
    <button id="checkInboxBtn" class="secondary" style="margin-top: 10px;">Check Inbox</button>
    <div id="inbox"></div>

    <script src="popup.js"></script>
</body>
</html>
